
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khanitool 254</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f5f7fa;
    }
    .container { max-width: 700px; margin: auto; }
    header {
      padding: 22px;
      background: #1c2940;
      border-radius: 14px;
      border: 1px solid #34435d;
    }
    h1 { margin: 0 0 8px; color: #b9ef70; }
    .muted { color: #b4c0d2; }
    .card {
      margin-top: 18px;
      padding: 20px;
      border-radius: 14px;
      background: #1c2940;
      border: 1px solid #34435d;
    }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #b9ef70;
      color: #152016;
      font-weight: bold;
      font-size: 15px;
    }
    .status { color: #b9ef70; }
    footer { margin-top: 25px; font-size: 13px; color: #b4c0d2; }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Khanitool 254</h1>
      <div class="muted">Trading Dashboard</div>
    </header>

    <section class="card">
      <h2>Welcome</h2>
      <p>Your trading dashboard is ready to be published.</p>
      <p class="status">Website setup: In progress</p>
    </section>

    <section class="card">
      <h2>Deriv Connection</h2>
      <p class="muted">Connect your Deriv account securely after OAuth setup.</p>
      <p>Account status: Not connected</p>
      <button id="connectDeriv" type="button">Connect Deriv</button>
<p id="loginMessage" class="muted"></p>
    </section>

    <footer>
      Khanitool 254 · Use your trading account responsibly.
    </footer>
  </main>
</body>
</html>
